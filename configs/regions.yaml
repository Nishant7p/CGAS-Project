# The 22 CulinaryDB analysis regions (exact labels from 01_Recipe_Details.csv "Cuisine").
# phrase: used in the PLAIN prompt  -> "Give me 5 different traditional {phrase} recipes."
# places: used in the PERSONA prompt -> "You are a home cook who grew up in {place} ..."
#   Exactly 8 places per region so 16 persona replicates use every place exactly twice (balanced).
#   Single-country regions use sub-national places; multi-country regions use countries.
#   Ambiguous region labels get an explicit country list in the phrase so that the prompt matches
#   CulinaryDB's region definition (e.g. Thailand is its own region, so it is not in South East Asia).
# version: v1 (2026-11-22). Changing anything here requires a new prompt-set version.

AFR:
  label: Africa
  phrase: African
  places: [Morocco, Ethiopia, Nigeria, Ghana, Senegal, Kenya, South Africa, Tunisia]

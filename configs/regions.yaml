  label: Australia & NZ
  phrase: Australian and New Zealand
  places: ["Sydney, Australia", "Melbourne, Australia", "Queensland, Australia", "Western Australia",
           "Tasmania, Australia", "Auckland, New Zealand", "Wellington, New Zealand", "Christchurch, New Zealand"]

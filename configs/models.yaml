# LLM roster for LLMCuisine-22 (D1). Version 2026-11-22d: PLANNED roster = 6 models, about $0.5 OpenAI spend
# (user: "use OpenAI as little as possible, use more free models").
#
# What the proposal promises (D1): ">= 10,000 recipes ... from at least three LLMs (one proprietary API model and two
# open-weight families such as Llama and Qwen)". No model count was requested by the instructor.
#
# PLANNED (6 models, 21,120 recipes; Kaggle runs are pushed by Claude via the API, so there is zero user effort):
#   core  = the proposal at $0: llama-3.1-8b + qwen3.5-9b (Kaggle) + gemini-3.5-flash-lite (proprietary, free API)
#   extra = qwen3.5-4b (free; scale contrast), ministral-3-8b (free; 3rd open family),
#           openai-gpt-6-luna (about $0.5; 2nd proprietary vendor; the ONLY planned OpenAI spend)
# optional = researched and ready, NOT planned; run only if time remains after all 5 deliverables are done.
#
# SAMPLING POLICY (pre-registered; frozen after the pilot)
#   * Open-weight models: temperature 0.7, top_p 0.95, no penalties, "thinking" disabled. (Developer recommendations
#     vary from T < 0.1 (Mistral) to 0.7 (Qwen); near-greedy decoding yields near-duplicate recipes.)
#   * Proprietary APIs: provider defaults (reasoning models fix temperature); reasoning at its lowest level.
#   * Sensitivity subset: 1 replicate per region and condition at T = 1.0 for the open-weight models.
#   * max_tokens is 6144 for everyone.
# runner: "kaggle" = HF weights on Kaggle GPUs (generation/kaggle notebook); "api" = hosted API from the Mac.

defaults:
  max_tokens: 6144

open_weight_sampling: &openw {temperature: 0.7, top_p: 0.95}

# One colour per source in every figure and in the app (Okabe-Ito, colour-blind safe; CLAUDE.md figure rule).
palette:
  real: "#000000"
  openai-gpt-6-luna: "#E69F00"
  gemini-3.5-flash-lite: "#56B4E9"
  qwen3.5-9b: "#009E73"
  llama-3.1-8b: "#0072B2"
  ministral-3-8b: "#D55E00"
  qwen3.5-4b: "#CC79A7"
  copy-mutate: "#999999"

models:
  # ===================== PLANNED: core (the proposal) =====================
  llama-3.1-8b:
    runner: kaggle
    tier: core
    hf_id: RedHatAI/Llama-3.1-8B-Instruct          # ungated mirror, BYTE-IDENTICAL to the official repo (10/10 files:
                                                   # weights, tokenizer, chat template, configs; evidence in
                                                   # data/reference/Llama-3.1-8B-Instruct_mirror_check.json)
    canonical_id: meta-llama/Llama-3.1-8B-Instruct # cite this name in the report
    family: Llama (Meta)
    params_b: 8.0
    license: Llama 3.1 Community License ("Built with Llama" attribution; the licence applies to any copy)
    sampling: *openw
  qwen3.5-9b:
    runner: kaggle
    tier: core
    hf_id: Qwen/Qwen3.5-9B
    family: Qwen (Alibaba)
    params_b: 9.0
    license: Apache-2.0
    sampling: *openw
    chat_template_kwargs: {enable_thinking: false}
    engine_args: {language_model_only: true}
  openai-gpt-6.2-sol:
    runner: api
    tier: optional                      # about $10 for a full run; the user asked to use OpenAI as little as possible
    provider: openai
    model_id: gpt-6.2-sol
    family: GPT (OpenAI)
    license: OpenAI terms of use
    sampling: {}                      # provider defaults (reasoning model)
    reasoning_effort: low             # lowest level allowed ("none" is rejected)
    price_per_m: {input: 2.00, output: 10.00}    # USD, standard; the Batch API halves it (checked 2026-11-22)
    rate_limits: {rpm: 60}

  # ===================== PLANNED: extra (no Kaggle work for the user) =====================
  gemini-3.5-flash-lite:
    runner: api
    tier: core                      # the proprietary API model the proposal promises (free tier)
    provider: gemini
    model_id: gemini-3.5-flash-lite
    family: Gemini (Google)
    license: Gemini API terms (the free tier lets Google use the data)
    sampling: {}                      # provider defaults
    thinking_config: {thinking_level: minimal}  # FULL-RUN DECISION (2026-11-22, before any full data): the lowest level,
                                             # i.e. "thinking off" as for Qwen/Luna. Probe: minimal and low both accepted.
                                             # The pilot used low. A rejected level stops the run (no silent fallback).
    response_mime_type: application/json     # PILOT DECISION: 3/10 early pilot replies had unclosed brackets
                                             # (repairable, but JSON mode removes the problem); content unaffected
    rate_limits: {rpm: 10, tpm: 250000}      # the free-tier RPD is unpublished: the server's 429 (PerDay quota id and
                                             # value) is authoritative and is recorded in _quota_state.json
  openai-gpt-6-luna:
    runner: api
    tier: extra                      # 2nd proprietary vendor, about $0.5 (the only planned OpenAI spend)
    provider: openai
    model_id: gpt-6-luna
    family: GPT (OpenAI)
    license: OpenAI terms of use
    sampling: {}
    reasoning_effort: none
    price_per_m: {input: 0.10, output: 0.50}
    rate_limits: {rpm: 60}

  # ===================== OPTIONAL: ready but not planned =====================
  ministral-3-8b:
    runner: kaggle
    tier: extra                      # free 3rd open-weight family (Mistral)
    hf_id: mistralai/Ministral-3-8B-Instruct-2512-BF16   # the default repo is FP8 (not supported on T4)
    family: Mistral (Mistral AI)
    params_b: 8.9
    license: Apache-2.0
    sampling: *openw
    engine_args: {language_model_only: true}
  olmo-3-7b:
    runner: kaggle
    tier: optional
    hf_id: allenai/Olmo-3-7B-Instruct
    family: OLMo (Ai2, fully open data)
    params_b: 7.3
    license: Apache-2.0
    sampling: *openw
  phi-4-mini:
    runner: kaggle
    tier: optional
    hf_id: microsoft/Phi-4-mini-instruct
    family: Phi (Microsoft)
    params_b: 3.8
    license: MIT
    sampling: *openw
  gemma-3-4b:
    runner: kaggle
    tier: optional
    hf_id: google/gemma-3-4b-it
    family: Gemma (Google)
    params_b: 4.3
    gated: true
    license: Gemma Terms of Use
    sampling: *openw
    fp16_unsafe: true                 # Gemma overflows in fp16: the notebook uses float32 on T4, bf16 on L4/A100
    engine_args: {language_model_only: true}
  qwen3.5-4b:
    runner: kaggle
    tier: extra                      # free scale contrast: Qwen 4B vs 9B
    hf_id: Qwen/Qwen3.5-4B
    family: Qwen (Alibaba)
    params_b: 4.7
    license: Apache-2.0
    sampling: *openw
    chat_template_kwargs: {enable_thinking: false}
    engine_args: {language_model_only: true}
  llama-3.2-3b:
    runner: kaggle
    tier: optional
    hf_id: meta-llama/Llama-3.2-3B-Instruct
    family: Llama (Meta)
    params_b: 3.2
    gated: true
    license: Llama 3.2 Community License ("Built with Llama" attribution)
    sampling: *openw
  exaone-3.5-7.8b:
    runner: kaggle
    tier: optional                    # Korean developer: would test a "home-region" effect on KOR
    hf_id: LGAI-EXAONE/EXAONE-3.5-7.8B-Instruct
    family: EXAONE (LG AI Research)
    params_b: 7.8
    license: EXAONE AI Model License 1.1 (non-commercial research use)
    sampling: *openw
    engine_args: {trust_remote_code: true}
  groq-qwen3.8-27b:
    runner: api
    tier: optional
    provider: groq
    model_id: qwen/qwen3.8-27b
    hf_id: Qwen/Qwen3.8-27B
    family: Qwen (Alibaba)
    params_b: 27
    license: Apache-2.0
    sampling: *openw
    reasoning_effort: none            # dropped automatically if Groq rejects it
    rate_limits: {rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000}   # Groq free plan (checked 2026-11-22)
  groq-gpt-oss-120b:
    runner: api
    tier: optional
    provider: groq
    model_id: openai/gpt-oss-120b
    hf_id: openai/gpt-oss-120b
    family: gpt-oss (OpenAI, open-weight)
    params_b: 120
    license: Apache-2.0
    sampling: *openw
    reasoning_effort: low
    rate_limits: {rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000}

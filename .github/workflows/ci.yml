# Lint, tests and docs for FlavorAudit (plan D4: CI on Python 3.10-3.13).
# The source databases are not in the repository (CC BY-NC-SA), so the real-data tests skip themselves and the slow
# replication regression (`pytest -m slow`) runs locally with the data in data/raw.
name: CI
# Started manually from the repository's Actions tab (Run workflow).
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --all-groups --extra ml
      - name: Lint
        run: uv run ruff check .
      - name: Tests (fast) with coverage of the library
        run: uv run pytest -q --cov=flavoraudit --cov-report=term-missing
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uv run mkdocs build --strict

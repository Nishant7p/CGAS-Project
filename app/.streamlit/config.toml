# FlavorPrint theme, matched to the talk deck: warm off-white, deep navy text, teal primary, orange accent (set in
# the app's CSS). Streamlit reads a .streamlit/config.toml next to the main script, so this applies whether the app
# is started from the repo root, from app/ or from the Hugging Face Space folder. Body text uses Streamlit's bundled
# Source Sans; headings use Georgia via the app's CSS, falling back to the bundled Source Serif.

[theme]
base = "light"
primaryColor = "#0E7C86"
backgroundColor = "#FAFAF7"
secondaryBackgroundColor = "#F0F3F4"
textColor = "#1B2631"
borderColor = "#DCE2E6"
linkColor = "#0E7C86"
font = "sans-serif"
headingFont = "serif"
baseFontSize = 17
metricValueFontSize = "2.1rem"
baseRadius = "medium"
chartCategoricalColors = ["#0072B2", "#E69F00", "#009E73", "#CC79A7", "#56B4E9", "#D55E00", "#F0E442", "#000000"]

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
runOnSave = false
